name = "diet"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Database: created once with `wrangler d1 create diet`, then paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "diet"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Photo storage: created once with `wrangler r2 bucket create diet-photos`.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "diet-photos"
